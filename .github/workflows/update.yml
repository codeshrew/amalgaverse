name: Update & deploy

on:
  schedule:
    # GitHub drops/delays many top-of-hour and */30 schedules under load; odd minutes fire more reliably.
    - cron: '7,37 * * * *'            # steady refresh of votes
    - cron: '4,11,19,26 16,17 * * *'  # burst right after the 12:01 PM ET drop (EDT/EST)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'data/**', '.github/workflows/update.yml']   # site-only changes use deploy-site.yml

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write   # prune superseded caches

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Reply text, per-reply vote labels and mirrored videos persist between runs here,
      # never in git (the replies are other people's posts; the videos are large).
      # Small, fast-changing state (reply cache, vote labels, story.json) is saved every run.
      - uses: actions/cache@v6
        with:
          path: |
            .cache
            site/data
          key: state-${{ github.run_id }}
          restore-keys: state-

      # Videos (~200 MB) only change when a new beat drops, so they get their own cache
      # that's saved only when the set of files changes.
      - name: Restore mirrored videos
        uses: actions/cache/restore@v6
        with:
          path: site/media
          key: media-none
          restore-keys: media-

      # If the Actions cache was evicted, start from the published data so tallies
      # (and their history) carry over instead of being rebuilt from scratch.
      - name: Seed from the published site if the cache is cold
        run: |
          if [ ! -f site/data/story.json ]; then
            mkdir -p site/data
            curl -fsSL https://codeshrew.github.io/amalgaverse/data/story.json -o site/data/story.json || rm -f site/data/story.json
          fi

      - name: Pull posts, replies and tally votes
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SOCIALDATA_API_KEY: ${{ secrets.SOCIALDATA_API_KEY }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
        run: node scripts/update.mjs

      # The Claude cloud routine can only reach github.com, so its work packet
      # (tasks + reply samples, encrypted) is force-pushed to the agent-packets branch.
      - name: Ship work packet for the Claude routine
        env:
          AGENT_PACKET_KEY: ${{ secrets.AGENT_PACKET_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -n "$AGENT_PACKET_KEY" ] || { echo "no AGENT_PACKET_KEY; skipping"; exit 0; }
          node scripts/agent-tasks.mjs prepare --local
          node scripts/agent-tasks.mjs pack "$RUNNER_TEMP/packet.json"
          rm -rf "$RUNNER_TEMP/pk" && mkdir "$RUNNER_TEMP/pk" && cd "$RUNNER_TEMP/pk"
          git init -q && cp ../packet.json . && git add packet.json
          git -c user.name=amalgaverse-bot -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "Work packet $(date -u +%FT%TZ)"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:agent-packets

      - name: Save mirrored videos (only if new ones arrived)
        id: mediakey
        run: echo "key=media-$(ls site/media 2>/dev/null | sort | sha1sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v6
        continue-on-error: true   # "already exists" when nothing changed
        with:
          path: site/media
          key: ${{ steps.mediakey.outputs.key }}

      # Keep the repo under GitHub's 10 GB cache cap: drop superseded caches.
      - name: Prune old caches
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prune() { gh api "repos/$GITHUB_REPOSITORY/actions/caches?key=$1&sort=created_at&direction=desc&per_page=100" --jq '.actions_caches[].key' | tail -n +$(( $2 + 1 )) | while read -r k; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches?key=$k" >/dev/null && echo "pruned $k"; done; }
          prune state- 2
          prune media- 1

      # Only curation changes are committed (new beats catalogued, canon resolved).
      - name: Commit data changes
        run: |
          if ! git diff --quiet data/; then
            git config user.name "amalgaverse-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Catalogue beats and refresh vote readouts (CI)"
            git pull --rebase -X theirs -q && git push
          fi

      # GitHub Pages serves assets with a 10-minute cache; version the URLs so a
      # deploy shows up on the next page load.
      - name: Cache-bust asset URLs
        run: sed -i "s#assets/style.css#assets/style.css?v=${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}#; s#assets/app.js#assets/app.js?v=${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}#; s#data/story.js\"#data/story.js?v=${GITHUB_RUN_NUMBER}\"#" site/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      # Pages occasionally answers 502 while creating a deployment; one retry clears it.
      - name: Retry deploy after a transient Pages error
        if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
