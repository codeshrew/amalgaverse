name: Deploy site (fast)

# Style/layout/code changes under site/ publish in well under a minute: reuse the
# data, videos and story.json from the last pipeline run instead of re-fetching.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy-site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Restore last pipeline state (story data)
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache
            site/data
          key: state-none
          restore-keys: state-
      - name: Restore mirrored videos
        uses: actions/cache/restore@v6
        with:
          path: site/media
          key: media-none
          restore-keys: media-

      - name: Fall back to the published data if the cache has none
        run: |
          if [ ! -f site/data/story.json ]; then
            mkdir -p site/data
            curl -fsSL https://codeshrew.github.io/amalgaverse/data/story.json -o site/data/story.json
            curl -fsSL https://codeshrew.github.io/amalgaverse/data/story.js -o site/data/story.js
          fi

      - name: Cache-bust asset URLs
        run: sed -i "s#assets/style.css#assets/style.css?v=${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}#; s#assets/app.js#assets/app.js?v=${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}#; s#data/story.js\"#data/story.js?v=${GITHUB_SHA::7}\"#" site/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      # Pages occasionally answers 502 while creating a deployment; one retry clears it.
      - name: Retry deploy after a transient Pages error
        if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
